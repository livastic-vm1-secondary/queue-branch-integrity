merge_queue:
  mode: parallel
  max_parallel_checks: 2

scopes:
  source:
    manual: null

queue_rules:
  - name: default
    merge_method: merge-batch
    batch_size: 2
    batch_max_wait_time: 10 min
    allow_queue_branch_edit: false
    queue_conditions: []
    merge_conditions:
      - check-success = @github-actions/queue-hold

pull_request_rules:
  - name: queue controlled pull requests
    conditions:
      - base = main
      - label = vm1-scope-ready
    actions:
      queue:
        name: default
