queue_rules:
  - name: default
    merge_method: squash
    batch_size: 1
    batch_max_wait_time: 10 min
    allow_queue_branch_edit: false
    queue_conditions: []
    merge_conditions: []

  - name: vm1-samesha-protected
    merge_method: squash
    batch_size: 2
    batch_max_wait_time: 10 min
    allow_queue_branch_edit: false
    queue_conditions: []
    merge_conditions:
      - check-success = @github-actions/vm1-mq-samesha-protected

pull_request_rules:
  - name: VM1_CODEOWNERS_OWNER_CASE_IMPACT
    conditions:
      - base = main
      - title = VM1_CODEOWNERS_OWNER_CASE_IMPACT
      - label = vm1-codeowners-owner-case-trigger
    actions:
      queue:
        name: default

  - name: VM1_MQ_SAMESHA_PROTECTED_260917
    conditions:
      - base = main
      - label = vm1-mq-samesha-protected-260917
    actions:
      queue:
        name: vm1-samesha-protected
