queue_rules:
  - name: vm1-milestone-rename
    merge_method: merge-batch
    batch_size: 2
    batch_max_wait_time: 10 min
    checks_timeout: null
    allow_queue_branch_edit: false
    queue_conditions:
      - milestone = vm1-mile-old
    merge_conditions:
      - check-success = vm1-mile-hold-never

pull_request_rules:
  - name: queue vm1 milestone rename fixture
    conditions:
      - base = vm1-mile-base
      - milestone = vm1-mile-old
    actions:
      queue:
        name: vm1-milestone-rename
