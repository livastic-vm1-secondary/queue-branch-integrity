scopes:
  source:
    manual:

queue_rules:
  - name: default
    merge_method: squash
    batch_size: 1
    batch_max_wait_time: 10 min
    queue_conditions: []
    merge_conditions: []

pull_request_rules:
  - name: VM1_CODEOWNERS_OWNER_CASE_IMPACT
    conditions:
      - base = main
      - title = VM1_CODEOWNERS_OWNER_CASE_IMPACT
      - label = vm1-codeowners-owner-case-trigger
    actions:
      queue:
        name: default

  - name: VM1_GHA8845_EXTERNAL_SCOPE_IMPACT
    conditions:
      - base = main
      - author = livastic-vm1-secondary
      - 'title = merge queue: VM1_GHA8845_SCOPE_IMPACT'
      - -scope = critical
      - label = vm1-gha8845-impact-trigger
    actions:
      queue:
        name: default
