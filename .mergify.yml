queue_rules:
  - name: default
    merge_method: merge-batch
    batch_size: 2
    batch_max_wait_time: 10 min
    allow_queue_branch_edit: false
    queue_conditions: []
    merge_conditions:
      - check-success = @github-actions/queue-hold

pull_request_rules:
  - name: queue controlled pull requests
    conditions:
      - base = main
    actions:
      queue:
        name: default

merge_protections_settings:
  post_comment: false

merge_protections:
  - name: require all commits verified
    if:
      - base = main
    success_conditions:
      - "#commits-unverified = 0"
