queue_rules:
  - name: default
    merge_method: merge-batch
    batch_size: 2
    batch_max_wait_time: 10 min
    allow_queue_branch_edit: false
    queue_conditions: []
    merge_conditions:
      - check-success = @github-actions/queue-hold

pull_request_rules:
  - name: queue controlled pull requests
    conditions:
      - base = main
    actions:
      queue:
        name: default
  - name: VM1 codeowners precedence generic approval sentinel
    conditions:
      - head = vm1b-codeowners-precedence-20260912
      - "#approved-reviews-by = 0"
    actions:
      review:
        type: APPROVE
        message: VM1 controlled generic approval sentinel
