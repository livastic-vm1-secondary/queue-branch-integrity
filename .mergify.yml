merge_queue:
  checking_label: vm1-checking-pending

queue_rules:
  - name: default
    merge_method: merge-batch
    batch_size: 1
    batch_max_wait_time: 1 min
    checks_timeout: null
    allow_queue_branch_edit: false
    queue_conditions: []
    merge_conditions:
      - check-success = vm1-checking-hold-never

pull_request_rules:
  - name: queue controlled pull requests
    conditions:
      - base = main
    actions:
      queue:
        name: default

  - name: VM1_CHECKING_LABEL_PENDING_IMPACT
    conditions:
      - title = VM1_CHECKING_LABEL_PENDING_PROBE
      - label = vm1-checking-pending
      - -queue-name = default
    actions:
      merge: {}
