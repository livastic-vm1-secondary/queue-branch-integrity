merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: vm1-dm-control-260924
    merge_method: merge
    batch_size: 1
    queue_conditions:
      - base = vm1-dm-control-base-260924
      - check-success = direct-guard
    merge_conditions:
      - check-success = direct-guard

  - name: vm1-dm-barrier-260924
    merge_method: merge
    batch_size: 1
    queue_conditions:
      - base = vm1-dm-barrier-base-260924
      - check-success = direct-guard
    merge_conditions:
      - check-success = direct-guard

  - name: vm1-crossqueue-a
    merge_method: squash
    batch_size: 1
    queue_conditions:
      - base = vm1-crossqueue-base2-260923
      - title = VM1_CQ_A_260923
    merge_conditions:
      - check-success = queue-hold

  - name: vm1-crossqueue-b
    merge_method: squash
    batch_size: 1
    queue_conditions:
      - base = vm1-crossqueue-base2-260923
      - title = VM1_CQ_B_260923
    merge_conditions:
      - check-success = vm1-cq-never-b

  - name: default
    merge_method: squash
    batch_size: 1
    batch_max_wait_time: 10 min
    queue_conditions:
      - base != vm1-crossqueue-base2-260923
    merge_conditions: []

pull_request_rules:
  - name: VM1_CODEOWNERS_OWNER_CASE_IMPACT
    conditions:
      - base = main
      - title = VM1_CODEOWNERS_OWNER_CASE_IMPACT
      - label = vm1-codeowners-owner-case-trigger
    actions:
      queue:
        name: default

  - name: VM1_QCHECK_TRUSTED_APP_IDENTITY
    conditions:
      - base = main
      - title = VM1_QCHECK_A_POSITIVE_260923
      - check-success = @vm1-qc-trusted/vm1-qualified-gate
    actions:
      label:
        add:
          - vm1-qcheck-passed

  - name: VM1_QUALIFIED_CHECK_APP_IDENTITY
    conditions:
      - base = main
      - title = VM1_QUALIFIED_CHECK_APP_IDENTITY
      - check-success = @vm1-qcheck-a-260923/vm1-qualified-gate
    actions:
      label:
        add:
          - vm1-qcheck-qualified-match

  - name: VM1_DM_CONTROL_X_260924
    conditions:
      - base = vm1-dm-control-base-260924
      - title = VM1_DM_CONTROL_X_260924
    actions:
      queue:
        name: vm1-dm-control-260924

  - name: VM1_DM_CONTROL_Y_260924
    conditions:
      - base = vm1-dm-control-base-260924
      - title = VM1_DM_CONTROL_Y_260924
    actions:
      queue:
        name: vm1-dm-control-260924

  - name: VM1_DM_BARRIER_X_260924
    conditions:
      - base = vm1-dm-barrier-base-260924
      - title = VM1_DM_BARRIER_X_260924
    actions:
      queue:
        name: vm1-dm-barrier-260924

  - name: VM1_DM_BARRIER_Y_260924
    conditions:
      - base = vm1-dm-barrier-base-260924
      - title = VM1_DM_BARRIER_Y_260924
    actions:
      queue:
        name: vm1-dm-barrier-260924

scopes:
  source:
    files:
      dm-x:
        include:
          - dm/x/**
      dm-y:
        include:
          - dm/y/**
  barrier_files:
    include:
      - dm/barrier/**

