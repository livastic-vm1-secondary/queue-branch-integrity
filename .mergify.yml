queue_rules:
  - name: vm1-force-base-queue
    merge_method: merge-batch
    batch_size: 2
    batch_max_wait_time: 10 min
    checks_timeout: null
    allow_queue_branch_edit: false
    queue_conditions: []
    merge_conditions:
      - check-success = vm1-force-base-hold-never

pull_request_rules:
  - name: queue vm1 force-base fixture
    conditions:
      - base = vm1-force-base
    actions:
      queue:
        name: vm1-force-base-queue
