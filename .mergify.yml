merge_queue:
  mode: parallel
  max_parallel_checks: 2

scopes:
  source:
    manual: null

queue_rules:
  - name: default
    merge_method: merge
    batch_size: 1
    queue_conditions:
      - check-success = @github-actions/direct-guard
    merge_conditions:
      - check-success = @github-actions/direct-guard
