merge_queue:
  mode: parallel
  max_parallel_checks: 2

scopes:
  source:
    files:
      x:
        include:
          - DM_X_20260912.txt
      y:
        include:
          - DM_Y_PR_20260912.txt
          - DM_Y_BASE_20260912.txt

queue_rules:
  - name: default
    merge_method: merge
    batch_size: 1
    queue_conditions: []
    merge_conditions:
      - check-success = @github-actions/direct-guard
