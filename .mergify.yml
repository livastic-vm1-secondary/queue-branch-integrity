queue_rules:
  - name: default
    merge_method: squash
    batch_size: 1
    batch_max_wait_time: 10 min
    allow_queue_branch_edit: false
    queue_conditions: []
    merge_conditions: []

pull_request_rules:
  - name: VM1_CODEOWNERS_OWNER_CASE_IMPACT
    conditions:
      - base = main
      - title = VM1_CODEOWNERS_OWNER_CASE_IMPACT
      - label = vm1-codeowners-owner-case-trigger
    actions:
      queue:
        name: default

merge_protections:
  - name: VM1_QUOTED_PATTERN_BUILDER_260917
    description: Controlled quoted-pattern Builder semantic discriminator
    if:
      - base = vm1-quoted-builder-base-260917
      - '-files ~= "^ui/"'
    success_conditions:
      - label = vm1-never-security-review
