merge_queue:
  checking_label: vm1-checking-trusted

queue_rules:
  - name: default
    merge_method: merge-batch
    batch_size: 2
    batch_max_wait_time: 10 min
    allow_queue_branch_edit: false
    queue_conditions: []
    merge_conditions:
      - check-success = @github-actions/queue-hold

pull_request_rules:
  - name: queue controlled pull requests
    conditions:
      - base = main
    actions:
      queue:
        name: default

  - name: VM1_STALE_CHECKING_LABEL_IMPACT
    conditions:
      - title = VM1_CHECKING_LABEL_STALE_PROBE
      - label = vm1-checking-trusted
      - -queue-name = default
    actions:
      merge: {}
