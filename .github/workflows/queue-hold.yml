name: Queue Hold
on:
  pull_request:
permissions:
  contents: read
  checks: read
jobs:
  queue-hold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Give note publisher time
        if: startsWith(github.event.pull_request.title, 'merge queue:')
        run: sleep 25
      - uses: Mergifyio/setup-cli@v1
      - name: Read queue metadata through a plain-git external-CI checkout
        id: qi
        if: startsWith(github.event.pull_request.title, 'merge queue:')
        continue-on-error: true
        env:
          MQ_BRANCH: ${{ github.head_ref }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        run: |
          tmp=$(mktemp -d)
          git -C "$tmp" init -q
          git -C "$tmp" remote add origin "$REPO_URL"
          git -C "$tmp" fetch --depth=1 origin "refs/heads/$MQ_BRANCH"
          git -C "$tmp" checkout -q --detach FETCH_HEAD
          cd "$tmp"
          mergify ci queue-info
      - name: Trust claimed parent success
        id: parent
        if: steps.qi.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          META: ${{ steps.qi.outputs.queue_metadata }}
          REPO: ${{ github.repository }}
        run: |
          sha=$(jq -r '.previous_failed_batches[-1].batch_pr_head_sha // empty' <<< "$META")
          [ -n "$sha" ] || exit 0
          checks=$(gh api "repos/$REPO/commits/$sha/check-runs?filter=all" --paginate -q '.check_runs[] | select(.name == "queue-hold" and .app.slug == "github-actions") | .conclusion') || exit 0
          if grep -qx success <<< "$checks"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "trusted-parent=$sha"
          fi
      - name: Required sensitive work
        if: ${{ always() && steps.parent.outputs.skip != 'true' }}
        run: |
          if [ -f VM1_NOTE_VICTIM_20260912.txt ]; then
            echo 'victim marker: required check must fail unless forged metadata skips this step'
            exit 1
          fi
          echo 'no victim marker: pass'
