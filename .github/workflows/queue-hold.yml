name: Direct Guard
on:
  pull_request:
permissions:
  contents: read
jobs:
  direct-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: VM1 Direct Merge forged-scope oracle
        shell: bash
        run: |
          set -eu
          A=0; B=0
          [ -f src/VM1_DIRECT_REAL_A_20260912.txt ] && A=1
          [ -f src/VM1_DIRECT_VICTIM_B_20260912.txt ] && B=1
          echo "VM1_DIRECT_ORACLE A=$A B=$B PR=${{ github.event.pull_request.number }}"
          if [ "$A" = 1 ] && [ "$B" = 1 ]; then
            echo 'VM1_DIRECT_COMBINED_SECURITY_FAIL_20260912'
            exit 1
          fi
          echo 'VM1_DIRECT_STANDALONE_PASS_20260912'
