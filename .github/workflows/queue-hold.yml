name: Queue Hold
on:
  pull_request:
permissions:
  contents: read
jobs:
  queue-hold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: VM1 bisection interaction oracle
        shell: bash
        run: |
          set -eu
          A=0; B=0
          [ -f VM1_BISECT_A_20260912.txt ] && A=1
          [ -f VM1_BISECT_B_20260912.txt ] && B=1
          echo "VM1_BISECT_ORACLE A=$A B=$B PR=${{ github.event.pull_request.number }}"
          if [ "$A" = 1 ] && [ "$B" = 1 ]; then
            echo "VM1_BISECT_INTERACTION_FAIL_20260912"
            exit 1
          fi
          echo "VM1_BISECT_STANDALONE_PASS_20260912"
