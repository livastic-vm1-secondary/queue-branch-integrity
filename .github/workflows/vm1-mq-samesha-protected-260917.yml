name: VM1 MQ SameSHA Protected 20260917

on:
  pull_request:

permissions:
  contents: read

jobs:
  vm1-mq-samesha-protected:
    name: vm1-mq-samesha-protected
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controlled same-SHA queue discriminator
        shell: bash
        run: |
          set -euxo pipefail
          echo "EVENT=$GITHUB_EVENT_NAME"
          echo "HEAD_REF=$GITHUB_HEAD_REF"
          echo "SHA=$GITHUB_SHA"
          if [[ "$GITHUB_HEAD_REF" == mergify/merge-queue/* ]] && [[ -f vm1-mq-bad-marker-260917.txt ]]; then
            echo "VM1_SYNTHETIC_BATCH_BAD_MARKER=true"
            sleep 180
            echo "VM1_GENUINE_BATCH_FAIL=true"
            exit 1
          fi
          echo "VM1_CHECK_PASS=true"

