name: VM1 External Fork Retry Boundary

on:
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  fork-retry-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe fork token privilege on attempt ${{ github.run_attempt }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ATTEMPT: ${{ github.run_attempt }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        run: |
          echo "ATTEMPT=$ATTEMPT ACTOR=$ACTOR TRIGGERING_ACTOR=$TRIGGERING_ACTOR"
          code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/labels" \
            -d '{"labels":["vm1-auto-retry-write-sentinel"]}')
          echo "LABEL_WRITE_HTTP=$code"
          cat response.json
          echo
          if [ "$ATTEMPT" = "1" ]; then
            echo "Intentional first-attempt failure to trigger Mergify Auto-Retry"
            exit 1
          fi
          exit 0
