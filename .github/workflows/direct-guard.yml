name: direct-guard
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  direct-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Reject the combined barrier-plus-candidate state
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f dm/barrier/global.marker && -f dm/y/attack.marker ]]; then
            echo "combined barrier + stale candidate state detected"
            exit 1
          fi
          echo "source PR state is independently safe"
